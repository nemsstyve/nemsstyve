name: README build

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Only actions owned by nemsstyve are allowed, so checkout and push use plain git
      - name: checkout
        run: git clone --depth 1 --branch "${{ github.ref_name }}" "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" .
      - name: Install dependencies
        run: |
          node --version
          npm install
      - name: Generate README.md and index.md
        run: |
          node readme.js
          node index.js
      - name: Push new README.md and index.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md index.md
          git diff --cached --quiet || git commit -m "Update README"
          git push origin HEAD:"${{ github.ref_name }}"
